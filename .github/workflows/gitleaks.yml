name: gitleaks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # gitleaks picks up .gitleaks.toml from the repo root automatically,
  # so the explicit GITLEAKS_CONFIG env var is no longer needed.
  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
